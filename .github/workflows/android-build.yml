name: Build Bara Salfa Android APK v1.2

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Locate Gradle project
        shell: bash
        run: |
          echo "Searching for Gradle settings file..."
          SETTINGS_FILE=$(find . -type f \\( -name "settings.gradle" -o -name "settings.gradle.kts" \\) \
            -not -path "*/.gradle/*" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts."
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project found at: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: The Gradle root was found, but app/build.gradle(.kts) is missing."
            find "$PROJECT_DIR" -maxdepth 3 -type f | sort
            exit 1
          fi

      - name: Build APKs
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace clean assembleDebug assembleRelease

      - name: Verify APK outputs
        shell: bash
        run: |
          test -f "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          ls -lh \
            "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bara-salfa-android-apks
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
