name: Build Bara Salfa Android APK v1.2

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Prepare Project Structure & Build APK
        run: |
          # إذا تم رفع الملف المضغوط مباشرة بدون فك الضغط، يقوم بفك ضغطه تلقائياً
          if [ ! -f "settings.gradle" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Found ZIP file: $ZIP_FILE - extracting..."
              unzip -o "$ZIP_FILE" -d .
            fi
          fi

          # البحث عن مكان ملف settings.gradle في حال كان داخل مجلد فرعي
          GRADLE_DIR=$(dirname $(find . -name "settings.gradle" | head -n 1))
          echo "Building in directory: $GRADLE_DIR"
          cd "$GRADLE_DIR"

          # قبول تراخيص Android SDK وبناء نسخة التثبيت
          yes | sdkmanager --licenses || true
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

          # نسخ ملفات الـ APK الناتجة إلى مجلد موحد للتحميل
          mkdir -p "$GITHUB_WORKSPACE/output-apk"
          find . -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/output-apk/" \;
          ls -la "$GITHUB_WORKSPACE/output-apk/"

      - name: Upload Ready APK (v1.2)
        uses: actions/upload-artifact@v4
        with:
          name: Bara-Salfa-Yemeni-v1.2-APK
          path: output-apk/*.apk
